name: Build the pinned bottlerocket-project-website preview

# Builds whatever fork + branch is pinned in site/bottlerocket-preview.json
# into site/previews/bottlerocket/current/. Runs automatically whenever that
# pointer file changes on main; can also be kicked off by hand.
on:
  push:
    branches:
      - main
    paths:
      - "site/bottlerocket-preview.json"
      - ".github/workflows/build-bottlerocket-branch.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Share the "pages" concurrency group with deploy.yml so the two never
# deploy on top of each other.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.156.0

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this site (to commit the build into)
        uses: actions/checkout@v4
        with:
          path: own-site

      - name: Read the pinned fork and branch
        id: pin
        working-directory: own-site
        run: |
          fork=$(jq -r '.fork' site/bottlerocket-preview.json)
          branch=$(jq -r '.branch' site/bottlerocket-preview.json)
          if [[ -z "$fork" || "$fork" == "null" || -z "$branch" || "$branch" == "null" ]]; then
            echo "site/bottlerocket-preview.json must set both 'fork' and 'branch'" >&2
            exit 1
          fi
          echo "fork=$fork" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ steps.pin.outputs.fork }}@${{ steps.pin.outputs.branch }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.fork }}
          ref: ${{ steps.pin.outputs.branch }}
          submodules: recursive
          fetch-depth: 0
          path: br-site

      - name: Checkout bottlerocket-os/bottlerocket (content dependency)
        uses: actions/checkout@v4
        with:
          repository: bottlerocket-os/bottlerocket
          path: br-site/bottlerocket

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Install Node.js dependencies
        working-directory: br-site
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Build with Hugo
        working-directory: br-site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          dest="$GITHUB_WORKSPACE/own-site/site/previews/bottlerocket/current"
          rm -rf "$dest"
          mkdir -p "$dest"
          hugo \
            --gc \
            --minify \
            --baseURL "https://piyush-jena.github.io/previews/bottlerocket/current/" \
            --destination "$dest"

      - name: Commit and push the built preview
        working-directory: own-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "site/previews/bottlerocket/current"
          if git diff --cached --quiet; then
            echo "no changes, pinned branch built identically to what's already there"
            exit 0
          fi
          git commit -m "bottlerocket preview: ${{ steps.pin.outputs.fork }}@${{ steps.pin.outputs.branch }}"
          git push

      # Deploy the freshly built site directly. A GITHUB_TOKEN commit can't
      # trigger deploy.yml, so this workflow publishes the new build itself.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: own-site/site

  deploy:
    needs: build-and-commit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
